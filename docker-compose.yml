services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assetfactory
      POSTGRES_USER: assetfactory
      POSTGRES_PASSWORD: assetfactory
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetfactory -d assetfactory"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes:
      - redisdata:/data

  migrate:
    build: .
    env_file: .env
    command: ["python","-m","app.migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["rq","worker","asset-factory","--url","redis://redis:6379/0"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python","-m","app.scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
