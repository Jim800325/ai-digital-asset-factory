name: Bilibili Health Monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  health-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Run protected Bilibili health monitor
        env:
          MONITOR_URL: ${{ secrets.SHRIMP_BILIBILI_HEALTH_MONITOR_URL }}
          MONITOR_KEY: ${{ secrets.SHRIMP_BILIBILI_HEALTH_MONITOR_KEY }}
        run: |
          if [ -z "$MONITOR_URL" ] || [ -z "$MONITOR_KEY" ]; then
            echo "Bilibili health monitor secrets are not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error             --request POST             --header "X-Shrimp-Health-Monitor-Key: $MONITOR_KEY"             "$MONITOR_URL/internal/shrimp-animation/bilibili-health-monitor"
