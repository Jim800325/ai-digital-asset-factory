name: Bilibili Reliability Scorecard

on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:

jobs:
  reliability-scorecard:
    runs-on: ubuntu-latest
    steps:
      - name: Generate protected Bilibili reliability scorecard
        env:
          MONITOR_URL: ${{ secrets.SHRIMP_BILIBILI_HEALTH_MONITOR_URL }}
          MONITOR_KEY: ${{ secrets.SHRIMP_BILIBILI_HEALTH_MONITOR_KEY }}
        run: |
          if [ -z "$MONITOR_URL" ] || [ -z "$MONITOR_KEY" ]; then
            echo "Bilibili reliability secrets are not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error \
            --request POST \
            --header "X-Shrimp-Health-Monitor-Key: $MONITOR_KEY" \
            "$MONITOR_URL/internal/shrimp-animation/bilibili-reliability-scorecard"

          curl --fail --silent --show-error \
            --request POST \
            --header "X-Shrimp-Health-Monitor-Key: $MONITOR_KEY" \
            "$MONITOR_URL/internal/shrimp-animation/bilibili-reliability-analysis"
