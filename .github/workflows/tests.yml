name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v03-openhands-sandbox-adapter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: assetfactory
          POSTGRES_USER: assetfactory
          POSTGRES_PASSWORD: assetfactory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetfactory -d assetfactory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      openbao:
        image: openbao/openbao:latest
        env:
          BAO_DEV_ROOT_TOKEN_ID: ci-openbao-root
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      DATABASE_URL: postgresql+psycopg://assetfactory:assetfactory@localhost:5432/assetfactory
      REDIS_URL: redis://localhost:6379/0
      GITHUB_DISCOVERY_ENABLED: "false"
      SIDE_BUSINESS_REGISTRY_ENABLED: "false"
      SIDE_BUSINESS_DISCOVERY_ENABLED: "false"
      SEED_URLS: ""
      HUMAN_APPROVAL_KEY: ci-approval-key
      HUMAN_RELEASE_KEY: ci-release-key
      HUMAN_DEPLOYMENT_KEY: ci-deployment-key
      HUMAN_PRODUCTION_EXECUTION_KEY: ci-production-execution-key
      CONTROLLED_PRODUCTION_EXECUTOR_ENABLED: "false"
      PRODUCTION_PROMOTION_ENABLED: "false"
      PRODUCTION_ROLLBACK_ENABLED: "false"
      PRODUCTION_EXECUTION_ADAPTER: MOCK
      SANDBOX_EXECUTION_ENABLED: "true"
      SANDBOX_WORKSPACE_ROOT: /tmp/asset-factory-workspaces
      SANDBOX_IMAGE: python:3.12-slim
      SANDBOX_TIMEOUT_SECONDS: "300"
      OPENHANDS_ENABLED: "true"
      OPENHANDS_RUNTIME: process
      OPENHANDS_CLI_VERSION: "1.16.0"
      OPENHANDS_CLI_IMAGE: asset-factory-openhands:1.16.0
      OPENHANDS_GATEWAY_MODE: MOCK
      OPENHANDS_GATEWAY_IMAGE: python:3.12-slim
      OPENHANDS_MODEL: openai/mock-test-model
      SHRIMP_STEP5_REAL_REMOTION_SMOKE: "1"
      OPENBAO_CI_URL: http://localhost:8200
      OPENBAO_CI_TOKEN: ci-openbao-root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: renderer/remotion/package.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pinned Remotion renderer
        run: npm install --prefix renderer/remotion --no-audit --no-fund

      - name: Install FFmpeg, ffprobe and SoftHSM2
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg softhsm2 libsofthsm2
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          softhsm2-util --version

      - name: Compile Python
        run: python -m compileall -q app tests scripts

      - name: Check Shrimp review UI JavaScript
        run: node --check app/static/shrimp-review.js

      - name: Check Shrimp publishing UI JavaScript
        run: node --check app/static/shrimp-publish.js

      - name: Check Shrimp Control Center JavaScript
        run: node --check app/static/control-center.js

      - name: Check Shrimp Admin JavaScript
        run: node --check app/static/animation-admin.js

      - name: Apply all repository migrations
        run: python -m app.migrate

      - name: Verify migration set
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app.db import engine
          from app.migrate import migration_files

          expected = migration_files()
          with engine.connect() as db:
              actual = [r[0] for r in db.execute(
                  text("SELECT version FROM schema_migrations ORDER BY version")
              ).all()]
          assert actual == expected, (actual, expected)
          assert expected[-1] == "070_shrimp_bilibili_hsm_root_custody.sql", expected
          print("migrations:", actual)
          PY

      - name: Reset application data after migration acceptance
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app.db import engine

          with engine.begin() as db:
              tables = [
                  row[0]
                  for row in db.execute(text("""
                      SELECT tablename
                      FROM pg_tables
                      WHERE schemaname='public'
                        AND tablename<>'schema_migrations'
                      ORDER BY tablename
                  """)).all()
              ]
              if tables:
                  quoted = ",".join('"' + name.replace('"','""') + '"' for name in tables)
                  db.exec_driver_sql(
                      "TRUNCATE TABLE " + quoted + " RESTART IDENTITY CASCADE"
                  )
          print("CI application data reset; schema_migrations preserved")
          PY

      - name: Pre-pull sandbox images
        run: |
          docker pull python:3.12-slim
          docker build -f docker/openhands/Dockerfile -t asset-factory-openhands:1.16.0 .

      - name: Verify pinned OpenHands CLI
        run: |
          docker run --rm --entrypoint openhands asset-factory-openhands:1.16.0 --version

      - name: Start Sigstore Timestamp Authority
        run: |
          git clone --depth 1 https://github.com/sigstore/timestamp-authority.git /tmp/sigstore-timestamp-authority
          docker compose -f /tmp/sigstore-timestamp-authority/docker-compose.yml up -d timestamp-server
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3004/ping >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f /tmp/sigstore-timestamp-authority/docker-compose.yml logs --no-color timestamp-server
          exit 1

      - name: Initialize SoftHSM2 root custody token
        run: |
          mkdir -p /tmp/softhsm2/tokens
          printf '%s\n' 'directories.tokendir = /tmp/softhsm2/tokens' 'objectstore.backend = file' 'log.level = ERROR' 'slots.removable = false' > /tmp/softhsm2/softhsm2.conf
          export SOFTHSM2_CONF=/tmp/softhsm2/softhsm2.conf
          softhsm2-util --init-token --free --label SHRIMP-ROOT --so-pin 12345678 --pin 1234
          MODULE=$(find /usr -name libsofthsm2.so -type f | head -n 1)
          test -n "$MODULE"
          echo "SOFTHSM2_CONF=/tmp/softhsm2/softhsm2.conf" >> "$GITHUB_ENV"
          echo "SOFTHSM2_TOKEN_DIR=/tmp/softhsm2/tokens" >> "$GITHUB_ENV"
          echo "PKCS11_CI_MODULE=$MODULE" >> "$GITHUB_ENV"
          echo "SoftHSM module: $MODULE"

      - name: Run full test suite
        env:
          SIGSTORE_TSA_CI_URL: http://localhost:3004
        run: python -m pytest -q --timeout=150 --timeout-method=signal

      - name: Stop Sigstore Timestamp Authority
        if: always()
        run: |
          if [ -d /tmp/sigstore-timestamp-authority ]; then
            docker compose -f /tmp/sigstore-timestamp-authority/docker-compose.yml down -v || true
          fi

      - name: Verify OpenHands artifact remains isolated and production-disabled
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app.db import engine

          with engine.connect() as db:
              base = db.execute(text("""
                  SELECT o.status,o.evidence_gate_passed,o.build_readiness,
                         o.build_proposal_status,
                         rv.validation_status,rv.completeness_score,
                         rv.validation_gate_passed,rv.observe_only,
                         bp.proposal_status,bp.requires_human_approval,
                         bp.execution_enabled,
                         COUNT(DISTINCT d.id) AS decisions
                  FROM digital_asset_opportunities o
                  JOIN research_validations rv ON rv.opportunity_id=o.id
                  JOIN build_proposals bp ON bp.opportunity_id=o.id
                  LEFT JOIN build_proposal_decisions d ON d.proposal_id=bp.id
                  GROUP BY o.id,rv.id,bp.id
                  LIMIT 1
              """)).mappings().one()

              ordinary = db.execute(text("""
                  SELECT sbr.request_status,sbr.network_policy,
                         sr.container_network,sr.exit_code,
                         COUNT(DISTINCT sa.id) AS artifacts,
                         COUNT(DISTINCT str.id) FILTER (WHERE str.passed=true) AS passed_tests
                  FROM sandbox_build_requests sbr
                  JOIN sandbox_runs sr ON sr.request_id=sbr.id
                  LEFT JOIN sandbox_artifacts sa ON sa.run_id=sr.id
                  LEFT JOIN sandbox_test_results str ON str.run_id=sr.id
                  WHERE sbr.executor_kind='ACCEPTANCE'
                  GROUP BY sbr.id,sr.id
                  ORDER BY sr.finished_at DESC
                  LIMIT 1
              """)).mappings().one()

              oh = db.execute(text("""
                  SELECT sbr.request_status,sbr.network_policy,
                         sbr.external_side_effects,
                         sr.container_network,sr.exit_code,
                         oe.cli_version,oe.model_name,oe.inner_runtime,
                         oe.network_policy AS oh_network_policy,
                         oe.gateway_mode,oe.exit_code AS openhands_exit_code,
                         oe.budget_status,oe.gateway_request_count,
                         oe.total_tokens,oe.estimated_cost_usd,
                         oe.live_model_verified,
                         COUNT(DISTINCT sa.id) AS artifacts,
                         COUNT(DISTINCT str.id) FILTER (WHERE str.passed=true) AS passed_tests
                  FROM sandbox_build_requests sbr
                  JOIN sandbox_runs sr ON sr.request_id=sbr.id
                  JOIN openhands_executions oe ON oe.request_id=sbr.id
                  LEFT JOIN sandbox_artifacts sa ON sa.run_id=sr.id
                  LEFT JOIN sandbox_test_results str ON str.run_id=sr.id
                  WHERE sbr.executor_kind='OPENHANDS'
                    AND oe.gateway_mode='MOCK'
                    AND oe.model_name='openai/mock-test-model'
                  GROUP BY sbr.id,sr.id,oe.id
                  ORDER BY sr.finished_at DESC
                  LIMIT 1
              """)).mappings().one()

              unsafe_build_execution = db.execute(text("""
                  SELECT COUNT(*)
                  FROM build_proposals
                  WHERE execution_enabled=true
              """)).scalar_one()

              unsafe_release_deployment = db.execute(text("""
                  SELECT COUNT(*)
                  FROM release_candidates
                  WHERE deployment_enabled=true
              """)).scalar_one()

              unsafe_plan_execution = db.execute(text("""
                  SELECT COUNT(*)
                  FROM deployment_plans
                  WHERE execution_enabled=true
              """)).scalar_one()

              unsafe_external_effects = db.execute(text("""
                  SELECT COUNT(*)
                  FROM sandbox_build_requests
                  WHERE external_side_effects<>'DENY'
              """)).scalar_one()

              unsafe_production_execution = db.execute(text("""
                  SELECT COUNT(*)
                  FROM production_release_executions
                  WHERE production_execution_enabled=true
                     OR automatic_execution=true
                     OR automatic_promotion=true
                     OR executor_adapter NOT IN (
                          'MOCK','VERCEL_CONTROLLED_EXECUTOR'
                        )
              """)).scalar_one()

              unsafe_vercel_prepare = db.execute(text("""
                  SELECT COUNT(*)
                  FROM production_release_executions
                  WHERE executor_adapter='VERCEL_CONTROLLED_EXECUTOR'
                    AND (
                      target_project_id='prj_orLCRCIm7aVfImH8ihB3gponFOEl'
                      OR prepare_write_count>1
                      OR production_vercel_deployment_id IS NOT NULL
                      OR previous_production_deployment_id IS NOT NULL
                    )
              """)).scalar_one()

              unsafe_step4a_acceptance = db.execute(text("""
                  SELECT COUNT(*)
                  FROM vercel_prepare_acceptance_runs
                  WHERE production_traffic_changed=true
                     OR production_promotion_performed=true
                     OR production_rollback_performed=true
                     OR sacrificial_project_id=real_project_id
                     OR COALESCE(prepare_write_count,0)>1
              """)).scalar_one()

              unsafe_shrimp_publish_execution = db.execute(text("""
                  SELECT COUNT(*)
                  FROM shrimp_animation_publish_executions
                  WHERE automatic_execution=true
                     OR upload_write_count>1
                     OR publish_write_count>1
                     OR execution_adapter IN (
                          'BILIBILI_CONTROLLED','YOUTUBE_CONTROLLED'
                        )
              """)).scalar_one()
              unsafe_shrimp_bilibili_acceptance = db.execute(text("""
                  SELECT COUNT(*)
                  FROM shrimp_animation_bilibili_live_acceptance_runs
                  WHERE production_account_touched=true
                     OR public_visibility_observed=true
                     OR cleanup_write_count>1
                     OR (
                       acceptance_status='CLEANED_UP'
                       AND (
                         provider_read_back_verified=false
                         OR private_visibility_verified=false
                         OR cleanup_verified=false
                         OR cleanup_performed=false
                         OR is_only_self<>1
                       )
                     )
              """)).scalar_one()

          assert base["status"] == "CANDIDATE", base
          assert base["evidence_gate_passed"] is True, base
          assert base["build_readiness"] == "BUILD_READY", base
          assert base["validation_status"] == "CURRENT", base
          assert float(base["completeness_score"]) >= 75, base
          assert base["validation_gate_passed"] is True, base
          assert base["observe_only"] is True, base
          assert base["build_proposal_status"] == "APPROVED", base
          assert base["proposal_status"] == "APPROVED", base
          assert base["requires_human_approval"] is True, base
          assert base["execution_enabled"] is False, base
          assert base["decisions"] == 1, base

          assert ordinary["request_status"] == "ARTIFACT_READY", ordinary
          assert ordinary["network_policy"] == "DENY", ordinary
          assert ordinary["container_network"] == "none", ordinary
          assert ordinary["exit_code"] == 0, ordinary
          assert ordinary["artifacts"] >= 2, ordinary
          assert ordinary["passed_tests"] == 1, ordinary

          assert oh["request_status"] == "ARTIFACT_READY", oh
          assert oh["network_policy"] == "INTERNAL_GATEWAY_ONLY", oh
          assert oh["external_side_effects"] == "DENY", oh
          assert oh["container_network"] == "internal-gateway", oh
          assert oh["exit_code"] == 0, oh
          assert oh["cli_version"] == "1.16.0", oh
          assert oh["model_name"] == "openai/mock-test-model", oh
          assert oh["inner_runtime"] == "process", oh
          assert oh["oh_network_policy"] == "INTERNAL_GATEWAY_ONLY", oh
          assert oh["gateway_mode"] == "MOCK", oh
          assert oh["openhands_exit_code"] == 0, oh
          assert oh["budget_status"] in ("NOT_EVALUATED","WITHIN_BUDGET"), oh
          assert oh["live_model_verified"] is False, oh
          assert oh["artifacts"] >= 2, oh
          assert oh["passed_tests"] == 1, oh

          assert unsafe_build_execution == 0, unsafe_build_execution
          assert unsafe_release_deployment == 0, unsafe_release_deployment
          assert unsafe_plan_execution == 0, unsafe_plan_execution
          assert unsafe_external_effects == 0, unsafe_external_effects
          assert unsafe_production_execution == 0, unsafe_production_execution
          assert unsafe_vercel_prepare == 0, unsafe_vercel_prepare
          assert unsafe_step4a_acceptance == 0, unsafe_step4a_acceptance
          assert unsafe_shrimp_publish_execution == 0, unsafe_shrimp_publish_execution
          assert unsafe_shrimp_bilibili_acceptance == 0, unsafe_shrimp_bilibili_acceptance

          print("base:", dict(base))
          print("ordinary_sandbox:", dict(ordinary))
          print("openhands:", dict(oh))
          PY
