name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  v03-build-proposal-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: assetfactory
          POSTGRES_USER: assetfactory
          POSTGRES_PASSWORD: assetfactory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetfactory -d assetfactory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      DATABASE_URL: postgresql+psycopg://assetfactory:assetfactory@localhost:5432/assetfactory
      REDIS_URL: redis://localhost:6379/0
      GITHUB_DISCOVERY_ENABLED: "false"
      SEED_URLS: ""
      HUMAN_APPROVAL_KEY: ci-approval-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Apply migrations 001 through 008
        run: python -m app.migrate

      - name: Verify migration set
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app.db import engine
          expected = [
              "001_initial.sql",
              "002_hunter_v02.sql",
              "003_cross_source_aggregator.sql",
              "004_evidence_quality.sql",
              "005_research_reports.sql",
              "006_audit_integrity.sql",
              "007_research_validation.sql",
              "008_build_proposals.sql",
          ]
          with engine.connect() as db:
              actual = [r[0] for r in db.execute(
                  text("SELECT version FROM schema_migrations ORDER BY version")
              ).all()]
          assert actual == expected, (actual, expected)
          print("migrations:", actual)
          PY

      - name: Run full test suite
        run: python -m pytest -q

      - name: Verify final approved proposal remains non-executable
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app.db import engine
          with engine.connect() as db:
              row = db.execute(text("""
                  SELECT o.status,o.evidence_gate_passed,o.build_readiness,
                         o.build_proposal_status,
                         rv.validation_status,rv.completeness_score,
                         rv.validation_gate_passed,rv.observe_only,
                         bp.proposal_status,bp.requires_human_approval,
                         bp.execution_enabled,
                         COUNT(d.id) AS decisions
                  FROM digital_asset_opportunities o
                  JOIN research_validations rv ON rv.opportunity_id=o.id
                  JOIN build_proposals bp ON bp.opportunity_id=o.id
                  LEFT JOIN build_proposal_decisions d ON d.proposal_id=bp.id
                  GROUP BY o.id,rv.id,bp.id
                  ORDER BY bp.updated_at DESC
                  LIMIT 1
              """)).mappings().one()
          assert row["status"] == "CANDIDATE", row
          assert row["evidence_gate_passed"] is True, row
          assert row["build_readiness"] == "BUILD_READY", row
          assert row["validation_status"] == "CURRENT", row
          assert float(row["completeness_score"]) >= 75, row
          assert row["validation_gate_passed"] is True, row
          assert row["observe_only"] is True, row
          assert row["build_proposal_status"] == "APPROVED", row
          assert row["proposal_status"] == "APPROVED", row
          assert row["requires_human_approval"] is True, row
          assert row["execution_enabled"] is False, row
          assert row["decisions"] == 1, row
          print("acceptance:", dict(row))
          PY
