name: Bilibili Daily Quota Audit

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

jobs:
  quota-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Run protected Bilibili daily quota audit
        env:
          MONITOR_URL: ${{ secrets.SHRIMP_BILIBILI_HEALTH_MONITOR_URL }}
          MONITOR_KEY: ${{ secrets.SHRIMP_BILIBILI_HEALTH_MONITOR_KEY }}
        run: |
          if [ -z "$MONITOR_URL" ] || [ -z "$MONITOR_KEY" ]; then
            echo "Bilibili quota audit secrets are not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error \
            --request POST \
            --header "X-Shrimp-Health-Monitor-Key: $MONITOR_KEY" \
            "$MONITOR_URL/internal/shrimp-animation/bilibili-daily-quota-audit"
